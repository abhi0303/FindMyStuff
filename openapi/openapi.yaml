        Omit `since` for a first, full sync. On every later call, pass back the `serverTime` the
        PREVIOUS response returned — never the device clock, which can drift. Covers every place you
        are an active member of unless `placeId` narrows it to one. Respects the same PRIVATE-item
        visibility rule as every other endpoint: an item marked PRIVATE by someone else never
        appears here, whether it changed or was deleted.
      operationId: SyncController_sync
