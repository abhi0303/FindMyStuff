          required: false
          in: query
          description: Narrow the sync to one place. Omit for every place you can see.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
      security:
        - bearer: []
      summary: Everything that changed since a given time — for offline backup
      tags:
        - sync
info:
  title: FindMyStuff API
  description: >-
    Remember where you kept your stuff.


    Hierarchy: **Place** (home/office/locker) → **Storage** tree (room → almirah → shelf → box) →
    **Item**.


    Every place-scoped route is nested under `/places/{placeId}` and is checked against your

    membership of that place. Asking for a place you are not a member of returns **404**, not 403 —

    the API never confirms that someone else's data exists.


    All routes except signup, login, refresh, logout and health require

    `Authorization: Bearer <accessToken>`.
  version: 0.1.0
  contact: {}
tags:
  - name: auth
    description: Signup, login, tokens and terms acceptance
  - name: users
    description: Your profile and looking people up
  - name: friends
    description: Friend requests — the step before sharing a place
  - name: places
    description: Houses, offices, lockers
  - name: members
    description: Who can see a place, and invite codes
  - name: storages
    description: The nested storage tree
  - name: items
    description: The things you keep
  - name: search
    description: Find where you kept something
  - name: sync
    description: Delta sync for offline backup — see FRONTEND.md
  - name: media
    description: Photo upload and serving
  - name: health
    description: Liveness
servers:
  - url: http://localhost:3000
    description: Local development
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          example: ok
        database:
          type: string
          enum:
            - up
            - down
          example: up
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - database
        - timestamp
    CreateMediaDto:
      type: object
      properties:
        base64:
          type: string
          description: Image as base64. A data URI ("data:image/jpeg;base64,...") or raw base64 both work.
        label:
          type: string
          description: Optional caption/filename, stored for reference only
      required:
        - base64
    MediaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Use this id when creating an item or storage
        ownerId:
          type: string
          format: uuid
        mimeType:
          type: string
          example: image/jpeg
        sizeBytes:
          type: number
          example: 284913
        width:
          type: object
          nullable: true
          example: 1600
        height:
          type: object
          nullable: true
          example: 1200
        checksum:
          type: string
          description: SHA-256 — re-uploading the same photo reuses the stored file
        createdAt:
          format: date-time
          type: string
      required:
        - id
        - ownerId
        - mimeType
        - sizeBytes
        - width
