    SyncResponse:
      type: object
      properties:
        serverTime:
          type: string
          format: date-time
          description: >-
            Store this and send it back as `since` on the next call — never the device clock. When
            `truncated` is true, this is NOT the actual current time: it is the cutoff up to which
            every array is guaranteed complete, so calling again with it is always safe and always
            makes progress. Calling again with the same `since` you just sent would not.
        places:
          type: array
          items:
            $ref: '#/components/schemas/PlaceResponse'
        storages:
          type: array
          items:
            $ref: '#/components/schemas/StorageResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemResponse'
        deleted:
          $ref: '#/components/schemas/SyncDeletedIds'
        truncated:
          type: boolean
          description: >-
            true if any array below hit the per-call cap and there are more changes not yet
            delivered. If so, call again right away with the `serverTime` this response returned
            (see its description) rather than waiting.
          example: false
      required:
        - serverTime
        - places
        - storages
        - items
        - deleted
        - truncated
