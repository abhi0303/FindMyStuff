services:
  postgres:
    image: postgres:16-alpine
    container_name: findmystuff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: findmystuff
      POSTGRES_PASSWORD: findmystuff
      POSTGRES_DB: findmystuff
    ports:
      - '5433:5432'
    volumes:
      - findmystuff-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U findmystuff -d findmystuff']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  findmystuff-pgdata:
