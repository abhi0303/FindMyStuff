# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates the API service and its Postgres database together. In the Render
# dashboard: New → Blueprint → pick this repo.
#
# Region: `ohio` matches Neon's us-east-2, so the app sits next to its
# database. Put the app near the DATABASE, not near you — one page load makes
# several queries, and each one pays the round trip. Your own latency to the
# app is paid once.

services:
  - type: web
    name: findmystuff-api
    runtime: node
    plan: free
    region: ohio
    branch: main

    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, and the Nest CLI and TypeScript live there, so the
    # build would fail without it.
    buildCommand: npm ci --include=dev && npm run build

    # scripts/start-prod.js retries migrations with backoff and then starts the
    # server regardless. Chaining them with `&&` instead would mean one cold
    # database connection prevents the app from launching at all — a permanent
    # 502 until someone redeploys by hand.
    startCommand: npm run render:start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Neon connection strings. `sync: false` means Render prompts you for
      # the value instead of storing it in this file — never commit these.
      #   DATABASE_URL -> the POOLED host (contains "-pooler")
      #   DIRECT_URL   -> the same host WITHOUT "-pooler", used by migrations
      # BOTH are required. Leaving either unset fails the deploy at startup
      # with "P1012: Environment variable not found".
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Render generates these once and keeps them stable across deploys.
      # Rotating them logs every user out.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d

      # Bump this when the terms text changes; every user is re-prompted.
      - key: TERMS_VERSION
        value: '2026-09-01'

      # sync: false means "ask me in the dashboard" — set it to your frontend
      # URL once that is deployed, e.g. https://findmystuff.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # Leave the API docs reachable so the frontend developer can browse them.
      # Set to 'false' before this holds real user data.
      - key: SWAGGER_ENABLED
        value: 'true'

      # Images go to object storage: Render's own disk is wiped on every
      # deploy, restart and wake from sleep, which lost uploaded photos.
      - key: MEDIA_DRIVER
        value: s3
      # Must match the bucket name exactly as shown in Neon -> Object storage.
      - key: MEDIA_S3_BUCKET
        value: storage-and-things
      - key: MEDIA_S3_PREFIX
        value: media
      - key: MEDIA_S3_FORCE_PATH_STYLE
        value: 'true'
      # Object storage credentials — set these in the Render dashboard.
      # With MEDIA_DRIVER=s3 the app refuses to boot until all four are set.
      - key: AWS_REGION
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_LOCAL_PATH
        value: ./storage/media
      - key: MEDIA_MAX_BYTES
        value: '8388608'
      - key: MEDIA_THUMBNAIL_WIDTH
        value: '320'

      - key: THROTTLE_TTL_SECONDS
        value: '60'
      # 120 (a common generic default) was too tight for how this app's pages
      # actually load: one screen can fan out to 6-8 GET calls (place, tree,
      # items in a couple of filter variants, attention, storage detail), and
      # React's StrictMode doubles every one of those in development. Once
      # `trust proxy` correctly identifies each real client instead of
      # pooling everyone behind Render's edge into one bucket, a single
      # user's own normal navigation was enough to trip this. 300/min still
      # meaningfully rate-limits scripted abuse; it does not touch the much
      # tighter, separate 'auth' bucket below, which still guards signup/login.
      - key: THROTTLE_LIMIT
        value: '300'
      - key: AUTH_THROTTLE_TTL_SECONDS
        value: '300'
      - key: AUTH_THROTTLE_LIMIT
        value: '10'

      # How long an Idempotency-Key is remembered for safe retries.
      - key: IDEMPOTENCY_KEY_TTL_HOURS
        value: '24'
